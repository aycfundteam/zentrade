name: Bug report
description: Report a reproducible simulator or CLI problem
title: "[bug] "
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction command
      description: Exclude credentials and private account data.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or version
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Relevant result.json fields
